<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="103班 · 宿舍风采">
  <title>宿舍风采 · 103班 音乐领军班</title>
  <!-- 跨文档视图过渡:多页之间平滑切换,无白屏 -->
  <meta name="view-transition" content="same-origin">
  <!-- 西文/数字字体 Inter(中文自动回退苹方 PingFang SC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/dormitory.css">
</head>
<body>
  <!-- 顶部导航栏由 assets/js/nav.js 动态注入 -->

  <section class="page-hero">
    <div class="no">Home Stage</div>
    <h1><span class="gold-text">宿舍风采</span></h1>
    <p>每一间宿舍,都是一间小型录音棚</p>
  </section>

  <section class="section">
    <div class="container">
      <div id="dorm-grid" class="dorm-grid">
        <!-- 宿舍卡片由 assets/js/dormitory.js 渲染 -->
      </div>
    </div>
  </section>

  <!-- 灯箱:点击照片查看完整原图(不裁切),可左右翻看 -->
  <div class="lightbox" id="lightbox">
    <span class="close" id="lightbox-close">×</span>
    <span class="nav prev" id="lightbox-prev" hidden>‹</span>
    <span class="nav next" id="lightbox-next" hidden>›</span>
    <div>
      <img id="lightbox-img" src="" alt="宿舍照片">
      <div class="lightbox-caption" id="lightbox-caption"></div>
    </div>
    <div class="counter" id="lightbox-counter"></div>
  </div>

  <script src="assets/js/nav.js"></script>
  <script src="assets/js/dormitory.js"></script>
</body>
</html>
